<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello - My Webserver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            color: white;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            top: 20%;
            left: 20%;
            font-size: 60px;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            top: 60%;
            right: 20%;
            font-size: 50px;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            bottom: 20%;
            left: 40%;
            font-size: 40px;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg); 
            }
            50% { 
                transform: translateY(-20px) rotate(180deg); 
            }
        }

        .main-content {
            text-align: center;
            z-index: 10;
            position: relative;
            animation: fadeIn 1s ease-out;
        }

        .server-icon {
            font-size: 80px;
            color: white;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        .main-title {
            font-size: 4rem;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
            animation: slideDown 0.8s ease-out;
        }

        .subtitle {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        .divider {
            width: 100px;
            height: 4px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            margin: 0 auto 30px;
            border-radius: 2px;
            animation: expand 1s ease-out 0.4s both;
        }

        .description {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
            animation: fadeInDelayed 1s ease-out 0.6s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDelayed {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { 
                opacity: 0; 
                transform: translateY(-50px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(50px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @keyframes expand {
            from { width: 0; }
            to { width: 100px; }
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1); 
                opacity: 1; 
            }
            50% { 
                transform: scale(1.05); 
                opacity: 0.8; 
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .server-icon {
                font-size: 60px;
            }
            
            .description {
                font-size: 1rem;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Background Elements -->
    <div class="floating-shapes">
        <div class="shape">🖥️</div>
        <div class="shape">🌐</div>
        <div class="shape">📡</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="server-icon">🖥️</div>
        
        <h1 class="main-title">Hello!</h1>
        
        <div class="subtitle">Welcome To My WebServer</div>
        
        <div class="divider"></div>
        
        <p class="description">
            Your server is running successfully and ready to serve content. 
            Everything is working perfectly!
        </p>
    </div>
</body>
</html>
