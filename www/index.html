<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebServer Team Portfolio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: url('ultra.png') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    box-sizing: border-box;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2.5rem 1rem 1rem 1rem;
    display: flex;
    flex-direction: row;
    min-height: 80vh;
    justify-content: space-between;
    border: 2px solid #fff;
    box-sizing: border-box;
    position: relative;
    top: 2vh;
  }
  .left {
    width: 40%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
  }
  .logo {
    font-size: 4rem;
    font-weight: bold;
    letter-spacing: 0.11em;
    margin-bottom: 1.7rem;
    margin-left: 0.3rem;
    border-bottom: 2px solid #fff;
    padding-bottom: 0.4rem;
  }
  .status {
    font-size: 1rem;
    margin-bottom: 2.5rem;
    margin-left: 0.1rem;
    white-space: pre-line;
    opacity: .8;
    letter-spacing: 0.05em;
  }
  .menu {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 2.5rem;
    width: 80%;
  }
  .menu-btn {
    display: block;
    background: #fff;
    color: #000;
    border: none;
    font-family: 'Share Tech Mono', monospace;
    font-size: 2rem;
    font-weight: bold;
    text-transform: uppercase;
    padding: 1rem 0;
    border-radius: 8px;
    cursor: pointer;
    box-sizing: border-box;
    width: 100%;
    transition: background 0.2s, color 0.2s;
    outline: 2px solid #fff;
    text-align: center;
    text-decoration: none;
    user-select: none;
  }
  .menu-btn:not(:first-child) {
    background: #000;
    color: #fff;
    outline: 2px solid #fff;
    border: 2px solid #fff;
  }
  .menu-btn:hover {
    filter: invert(100%);
  }
  .menu-btn.red {
    color: #ff2222 !important;
    background: #000 !important;
    border: 2px solid #ff2222 !important;
    outline: 2px solid #ff2222 !important;
  }
  .socials {
    display: flex;
    flex-direction: row;
    gap: 2rem;
    margin-top: 3rem;
    margin-bottom: 1rem;
    font-size: 1rem;
    letter-spacing: 0.05em;
  }
  .social-link {
    color: #fff;
    border-bottom: 2px solid #fff;
    text-decoration: none;
    padding: 0 0.2em;
    transition: color .2s;
  }
  .social-link:hover {
    color: #aaa;
    border-bottom: 2px dotted #aaa;
  }
  .right {
    width: 56%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem 0;
  }
  .robot-img {
    width: 95%;
    max-width: 520px;
    filter: grayscale(100%) contrast(170%);
    border: 2px solid #fff;
    image-rendering: pixelated;
    border-radius: 4px;
    background: #111;
  }
  @media(max-width:900px) {
    .container {
      flex-direction: column;
      top: 0;
    }
    .left, .right {
      width: 100%;
      align-items: center;
      justify-content: center;
    }
    .right {
      padding: 1rem 0;
      margin-bottom: 1rem;
    }
    .menu {
      width: 100%;
    }
  }

  /* Boot animation overlay updated */
  #bootup-overlay {
    position: fixed;
    z-index: 99999;
    left: 0; top: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 1s;
    font-family: 'Share Tech Mono', monospace;
  }
  #bootup-box {
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    min-width: 340px;
    max-width: 520px;
  }
  .bootup-line {
    font-size: 1.17rem;
    letter-spacing: 0.03em;
    white-space: pre;
    font-family: inherit;
    font-weight: 900;
  }
  .bootup-green {
    color: #34fd41;
  }
  .bootup-red {
    color: #fd3b3b;
  }
  .bootup-white {
    color: #fff;
  }
</style>
</head>
<body>
<!-- Animated Bootup Overlay -->
<div id="bootup-overlay">
  <div id="bootup-box"></div>
</div>
<!-- Main Page Content -->
<div class="container" id="main-content" style="opacity:0;">
  <div class="left">
    <div class="logo">WEBSERVER</div>
    <div class="status">
      SYSTEM V1 INITIALIZED<br>
      DIAGNOSTICS...OK<br>
      STANDBY - WAIT FOR WAKE
    </div>
    <div class="menu">
      <a href="/func" class="menu-btn">Functionalities</a>
      <a href="/team" class="menu-btn">Team</a>
      <a href="/bin" class="menu-btn">Binaries</a>
      <a href="/upload" class="menu-btn">Data</a>
      <a href="/photos/mch.jpg" class="menu-btn">Cat</a>
      <a href="/bin/i_will_die.py" class="menu-btn red">DONT CLICK UNTIL THE EVALUATION END</a>
    </div>
    <div class="socials">
      <a href="https://github.com/haitambenazza/webserver" class="social-link">GitHub</a>
    </div>
  </div>
</div>
<script>
// Boot sequence lines (text, color class)
const bootLines = [
  ["BOOT UP SEQUENCE READY", "bootup-white"],
  ["FIRMWARE", "bootup-white"],
  ["  LATEST VERSION (2112.08.06)", "bootup-green"],
  ["CALIBRATION", "bootup-white"],
  ["  EXPIRED", "bootup-red"],
  ["  NEW CALIBRATION REQUIRED", "bootup-red"],
  ["BEGINNING CALIBRATION", "bootup-white"],
  ["AUDIO         OK", "bootup-green"],
  ["VIDEO         OK", "bootup-green"],
  ["MECHANICS     OK", "bootup-green"],
  ["CALIBRATION COMPLETE", "bootup-green"],
  ["SERVER STATUS     ON", "bootup-green"],
  ["PRIMARY SETTINGS UPDATED", "bootup-green"],
  ["(ASSISTS AND OPTIONS AVAILABLE IN PAUSE MENU)", "bootup-white"],
  ["ALL SYSTEMS OPERATIONAL", "bootup-green"],
  ["LOADING STATUS UPDATE...", "bootup-white"]
];

// Type each line with a "typing" effect
const bootBox = document.getElementById('bootup-box');
const mainContent = document.getElementById('main-content');
const overlay = document.getElementById('bootup-overlay');

let currentLine = 0;
function typeLine(line, colorClass, doneCallback) {
  let idx = 0;
  const p = document.createElement('div');
  p.className = `bootup-line ${colorClass}`;
  bootBox.appendChild(p);
  function typeChar() {
    p.textContent = line.slice(0, idx);
    if(idx < line.length) {
      idx++;
      setTimeout(typeChar, 17 + Math.random() * 55); // randomized typing speed
    } else {
      setTimeout(doneCallback, 300); // Small pause after each line
    }
  }
  typeChar();
}

function typeSequence() {
  if(currentLine < bootLines.length) {
    const [text, colorClass] = bootLines[currentLine];
    typeLine(text, colorClass, function() {
      currentLine++;
      typeSequence();
    });
  } else {
    setTimeout(() => {
      overlay.style.opacity = 0;
      setTimeout(() => {
        overlay.style.display = "none";
        mainContent.style.opacity = 1;
      }, 1000);
    }, 700);
  }
}
typeSequence();
</script>
</body>
</html>
