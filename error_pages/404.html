<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .error-container {
            position: relative;
            z-index: 10;
        }

        .astronaut {
            font-size: 8rem;
            color: white;
            animation: float 4s ease-in-out infinite;
            margin-bottom: 2rem;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .error-code {
            font-size: 12rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite, bounce 2s ease-in-out infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .lost-message {
            color: white;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .space-description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3rem;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 1s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-home {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            animation: fadeInUp 1s ease-out 1.5s both;
            position: relative;
            overflow: hidden;
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn-home:hover::before {
            left: 100%;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.3);
            color: white;
        }

        .planets {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
        }

        .planet1 {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #e74c3c);
            top: 10%;
            right: 15%;
            animation: orbit 20s linear infinite;
        }

        .planet2 {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #feca57, #f39c12);
            bottom: 20%;
            left: 10%;
            animation: orbit 15s linear infinite reverse;
        }

        .planet3 {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #48dbfb, #3498db);
            top: 60%;
            right: 5%;
            animation: orbit 25s linear infinite;
        }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(50px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(50px) rotate(-360deg); }
        }

        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: shoot 3s linear infinite;
        }

        @keyframes shoot {
            0% {
                transform: translateX(-100px) translateY(-100px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(100vw) translateY(100vh);
                opacity: 0;
            }
        }

        .rocket {
            position: absolute;
            bottom: 10%;
            left: 5%;
            font-size: 3rem;
            color: #feca57;
            animation: rocket-fly 8s ease-in-out infinite;
        }

        @keyframes rocket-fly {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-50px) rotate(10deg);
            }
            50% {
                transform: translateY(-100px) rotate(-5deg);
            }
            75% {
                transform: translateY(-30px) rotate(5deg);
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="planets">
        <div class="planet planet1"></div>
        <div class="planet planet2"></div>
        <div class="planet planet3"></div>
    </div>

    <div class="shooting-star" style="top: 20%; animation-delay: 0s;"></div>
    <div class="shooting-star" style="top: 40%; animation-delay: 1s;"></div>
    <div class="shooting-star" style="top: 60%; animation-delay: 2s;"></div>

    <div class="rocket">
        <i class="fas fa-rocket"></i>
    </div>

    <div class="container-fluid d-flex align-items-center justify-content-center min-vh-100">
        <div class="error-container text-center">
            <div class="astronaut">
                <i class="fas fa-user-astronaut"></i>
            </div>
            <div class="error-code">404</div>
            <h1 class="lost-message">Lost in Space!</h1>
            <p class="space-description">
                The page you're looking for has drifted into the void.<br>
                Let's navigate you back to familiar territory.
            </p>
            <button class="btn btn-home btn-lg" onclick="navigateHome()">
                <i class="fas fa-home me-2"></i>
                Return to Earth
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function navigateHome() {
            window.location.href = '/';
        }

        // Create stars
        function createStars() {
            const starsContainer = document.querySelector('.stars');
            const numStars = 200;

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (Math.random() * 3 + 1) + 's';
                starsContainer.appendChild(star);
            }
        }

        // Create more shooting stars dynamically
        function createShootingStar() {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.top = Math.random() * 50 + '%';
            shootingStar.style.animationDelay = '0s';
            document.body.appendChild(shootingStar);

            setTimeout(() => {
                shootingStar.remove();
            }, 3000);
        }

        // Initialize
        createStars();
        
        // Create shooting stars periodically
        setInterval(createShootingStar, 5000);

        // Add parallax effect on mouse move
        document.addEventListener('mousemove', function(e) {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            document.querySelectorAll('.planet').forEach((planet, index) => {
                const speed = (index + 1) * 0.5;
                planet.style.transform += ` translate(${mouseX * speed}px, ${mouseY * speed}px)`;
            });
        });
    </script>
</body>
</html>
