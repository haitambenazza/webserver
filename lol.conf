server
{
    listen 9000;
    host 127.0.0.1;
    index index.html;
    server_name server;
    root www/;
    location / {
        index index.html;
    }
}

server
{
    listen 8090;
    host 127.0.0.1;
    index index.html;
    server_name server2;
    root /var/www/example.com/html;
    location / {
        index index.html;
    }
}
