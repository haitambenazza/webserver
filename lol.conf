server
{
    listen 9000 7;
    host 127.0.0.1;
    server_name server1;
    error_page 404 error_pages/404.html;
    location / {
        root www/;
        index meow.html;
        autoindex off;
    }
    location /home {
        root www/;
        index moew.html;
        cgi_enable on;
        upload_enable on;
    }
    location /favicon.ico
    {
        root www/;
        index ultrakill.png;
    }
    location /main
    {
        root www/;
        index main.cpp;
    }
    location /upload {
        index meow.html;
        root www/;
        cgi_enable off;
        upload_enable on;
    }
}


