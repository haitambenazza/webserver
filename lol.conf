server
{
    listen 9000;
    host 10.14.10.10;
    server_name server1;

    error_page 200 error_pages/200.html;
    error_page 201 error_pages/201.html;
    error_page 400 error_pages/400.html;
    error_page 403 error_pages/403.html;
    error_page 404 error_pages/404.html;
    error_page 405 error_pages/405.html;
    error_page 413 error_pages/413.html;
    error_page 414 error_pages/414.html;
    error_page 415 error_pages/415.html;
    error_page 500 error_pages/500.html;
    error_page 501 error_pages/501.html;
    error_page 505 error_pages/505.html;
    # max_body_size 3000000;
    location / {
        root www/;
        index index.html;
        autoindex off;
    }
    location /home {
        autoindex on;
        root www/;

    }
    location /favicon.ico
    {
        root www/;
        index ultrakill.png;
    }
    location /photo
    {
        root www/;
        autoindex on;
    }
    location /upload {
        root www/;
        cgi_enable off;
        autoindex on;
    }
    location /bin {
        root www/;
        cgi_enable on;
        _py /bin/python3;
        _rb /bin/ruby;
    }
}
