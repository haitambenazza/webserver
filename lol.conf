server
{
    listen 9000;
    host 127.0.0.1;
    server_name server1;

    # error_page 404 www/404.html;
    # error_page 501 www/501.html;
    max_body_size 3200000;
    location / {
        root www/;
        index index.html;

        allowed_methods GET POST;
    }
    location /favicon.ico
    {
        root www/;
        index ultrakill.png;
    }
    location /func
    {
        root www/;
        index func.html;
    }
    location /team
    {
        root www/;
        index team.html;
    }
    location /photos
    {
        autoindex on;
        root www/;
        allowed_methods GET;
    }
    location /upload 
    {
        allowed_methods POST;
        root www/;
        cgi_enable off;
        autoindex on;
    }
    location /bin {
        root www/;
        autoindex on;
        cgi_enable on;
        _py /bin/python3;
        _php /usr/bin/php;
        _rb /usr/bin/ruby;
        _sh /bin/bash;
    }
}
