server
{
    listen 9000;
    host 10.14.10.5;
    server_name server1;
    error_page 404 error_pages/404.html;
    # max_body_size 3000000;
    location / {
        root www/;
        index index.html;
        autoindex off;
    }
    location /home {
        autoindex on;
        root www/;
        cgi_enable on;
    }
    location /favicon.ico
    {
        root www/;
        index ultrakill.png;
    }
    location /photo
    {
        root www/;
        autoindex on;
    }
    location /upload {
        root www/;
        cgi_enable off;
        autoindex on;
    }
}
