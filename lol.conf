server
{
    listen 9000;
    host 127.0.0.1;
    server_name server1;
    root www/;
    location / {
        root www/;
        index index.html;
        cgi_enable on;
        upload_enable on;
    }
    location /home {
        root www/;
        index moew.html;
        cgi_enable on;
        upload_enable on;
    }
    location /favicon.ico
    {
        root www/;
        index cat.png;
    }
        location /main
    {
        index main.cpp;
    }
    location /upload {
        root www/;
        index index.html;
        cgi_enable off;
        upload_enable on;
    }
}

server
{
    listen 8085;
