server
{
    listen 9000;
    host 127.0.0.1;
    index index.html;
    server_name server1;
    root www/;
    location / {
        index index.html;
        cgi_enable on;
        upload_enable on;
    }
    location /upload {
        index index.html;
        cgi_enable off;
        upload_enable on;
    }
}

server
{
    listen 8085;
    host 127.0.0.1;
    index index.html;
    server_name server2;
    root www/;
    location / {
        index index.html;
    }
}
