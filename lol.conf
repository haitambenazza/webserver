server
{
    listen 8085;
    host 127.0.0.2;
    index index.html;
    server server;
    root www/;

    location / {
        index index.html;
    }
}

server
{
    listen 8000;
    host 127.0.0.1;
    index index.html;
    server_name server2;
    root /var/www/example.com/html;
    location / {
        index index.html;
    }
}
